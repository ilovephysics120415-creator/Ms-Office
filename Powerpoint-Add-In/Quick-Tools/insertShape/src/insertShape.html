<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Quick Tools - Insert Shape Functions</title>

  <!-- Office.js: required for Office.onReady / Office.actions.associate -->
  <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

  <script type="text/javascript">

    Office.onReady(() => {
      // Each of these names must match the <FunctionName> in the manifest's
      // ExecuteFunction actions for Group_Shapes.
      Office.actions.associate("actionInsertShapeCircle", actionInsertShapeCircle);
      Office.actions.associate("actionInsertShapeSquare", actionInsertShapeSquare);
      Office.actions.associate("actionInsertShapeRectangle", actionInsertShapeRectangle);
      Office.actions.associate("actionInsertShapeTriangle", actionInsertShapeTriangle);
      Office.actions.associate("actionInsertShapeRightTriangle", actionInsertShapeRightTriangle);
      Office.actions.associate("actionInsertShapeDiamond", actionInsertShapeDiamond);
      Office.actions.associate("actionInsertShapeEllipse", actionInsertShapeEllipse);
      Office.actions.associate("actionInsertShapeParallelogram", actionInsertShapeParallelogram);
      Office.actions.associate("actionInsertShapeTrapezoid", actionInsertShapeTrapezoid);
      Office.actions.associate("actionInsertShapeLine", actionInsertShapeLine);
      Office.actions.associate("actionInsertShapeCylinder", actionInsertShapeCylinder);
    });

    // Default placement/size for every inserted shape, in points.
    // Adjust freely - these just avoid every shape landing exactly on top
    // of the last one at (0,0).
    const DEFAULT_OPTIONS = { left: 100, top: 100, height: 120, width: 120 };

    /**
     * Shared helper: inserts a geometric shape of the given GeometricShapeType
     * onto the active slide.
     * @param {Office.AddinCommands.Event} event
     * @param {string} shapeType - a PowerPoint.GeometricShapeType value
     * @param {string} shapeName - friendly name to assign to the new shape
     * @param {object} [options] - override for left/top/height/width
     */
    async function insertGeometricShape(event, shapeType, shapeName, options) {
      try {
        await PowerPoint.run(async (context) => {
          const shapes = context.presentation.getSelectedSlides().getItemAt(0).shapes;
          const shape = shapes.addGeometricShape(shapeType, options || DEFAULT_OPTIONS);
          shape.name = shapeName;
          await context.sync();
        });
      } catch (error) {
        console.error(`insertGeometricShape (${shapeName}) failed:`, error);
      } finally {
        event.completed();
      }
    }

    // ---- Individual button handlers -----------------------------------

    async function actionInsertShapeCircle(event) {
      // No dedicated "Circle" enum value - a circle is an Ellipse
      // with equal width and height.
      await insertGeometricShape(
        event,
        PowerPoint.GeometricShapeType.ellipse,
        "Circle",
        { left: 100, top: 100, height: 120, width: 120 }
      );
    }

    async function actionInsertShapeSquare(event) {
      // No dedicated "Square" enum value - a square is a Rectangle
      // with equal width and height.
      await insertGeometricShape(
        event,
        PowerPoint.GeometricShapeType.rectangle,
        "Square",
        { left: 100, top: 100, height: 120, width: 120 }
      );
    }

    async function actionInsertShapeRectangle(event) {
      await insertGeometricShape(
        event,
        PowerPoint.GeometricShapeType.rectangle,
        "Rectangle",
        { left: 100, top: 100, height: 90, width: 160 }
      );
    }

    async function actionInsertShapeTriangle(event) {
      // "Triangle" in the API is the isosceles triangle.
      await insertGeometricShape(event, PowerPoint.GeometricShapeType.triangle, "Triangle");
    }

    async function actionInsertShapeRightTriangle(event) {
      await insertGeometricShape(
        event,
        PowerPoint.GeometricShapeType.rightTriangle,
        "RightTriangle"
      );
    }

    async function actionInsertShapeDiamond(event) {
      await insertGeometricShape(event, PowerPoint.GeometricShapeType.diamond, "Diamond");
    }

    async function actionInsertShapeEllipse(event) {
      await insertGeometricShape(
        event,
        PowerPoint.GeometricShapeType.ellipse,
        "Ellipse",
        { left: 100, top: 100, height: 90, width: 160 }
      );
    }

    async function actionInsertShapeParallelogram(event) {
      await insertGeometricShape(
        event,
        PowerPoint.GeometricShapeType.parallelogram,
        "Parallelogram"
      );
    }

    async function actionInsertShapeTrapezoid(event) {
      await insertGeometricShape(event, PowerPoint.GeometricShapeType.trapezoid, "Trapezoid");
    }

    async function actionInsertShapeCylinder(event) {
      // Cylinder has no "Cylinder" enum value - the API calls it "Can".
      await insertGeometricShape(event, PowerPoint.GeometricShapeType.can, "Cylinder");
    }

    // Line is not a GeometricShapeType at all - it uses the separate
    // addLine() method with a ConnectorType, not addGeometricShape().
    async function actionInsertShapeLine(event) {
      try {
        await PowerPoint.run(async (context) => {
          const shapes = context.presentation.getSelectedSlides().getItemAt(0).shapes;
          // For a line: left/top = start point, height/width = end point
          // (NOT literal height/width - see Microsoft's "Work with shapes" doc).
          const line = shapes.addLine(PowerPoint.ConnectorType.straight, {
            left: 100,
            top: 100,
            height: 20,
            width: 150,
          });
          line.name = "Line";
          await context.sync();
        });
      } catch (error) {
        console.error("actionInsertShapeLine failed:", error);
      } finally {
        event.completed();
      }
    }

  </script>
</head>
<body>
  <!--
    This page is never shown to the user. It is the add-in's "function file":
    a hidden page loaded in the background whose job is to associate each
    ExecuteFunction FunctionName declared in the manifest (Group_Shapes)
    with the JS handler that runs it.
  -->
</body>
</html>
