<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <title>Small Letters Pane</title>

  <!-- Office JavaScript API -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 12px;
      margin: 0;
      background-color: #f5f5f7;
      color: #333;
    }

    h3 {
      font-size: 14px;
      margin-top: 0;
      margin-bottom: 12px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .symbol-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px;
    }

    .symbol-btn {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      background-color: #ffffff;
      border: 1px solid #d1d1d6;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    .symbol-btn:hover {
      background-color: #007aff;
      color: #ffffff;
      border-color: #007aff;
    }

    .symbol-btn:active {
      transform: scale(0.97);
    }

    .symbol-glyph {
      font-family: "Cambria Math", serif;
      font-weight: bold;
      font-size: 18px;
      min-width: 20px;
      text-align: center;
    }

    .symbol-label {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <h3>Small Letters (\u{1D44E} - \u{1D467})</h3>

  <div class="symbol-grid" id="letterGrid">
    <!-- Buttons generated dynamically via JS -->
  </div>

  <script type="text/javascript">
    Office.onReady((info) => {
      if (info.host === Office.HostType.PowerPoint) {
        generateGrid();
      }
    });

    /**
     * Generates 26 small letter buttons (\u{1D44E} through \u{1D467})
     */
    function generateGrid() {
      const grid = document.getElementById("letterGrid");
      const startCode = 0x1D44E; // Math Italic 'a'
      const endCode = 0x1D467;   // Math Italic 'z'

      for (let code = startCode; code <= endCode; code++) {
        const letterChar = String.fromCodePoint(code);
        const charName = String.fromCharCode(97 + (code - startCode)); // 'a' through 'z'

        const btn = document.createElement("button");
        btn.className = "symbol-btn";
        btn.onclick = () => insertFormattedLetter(letterChar);

        const glyphSpan = document.createElement("span");
        glyphSpan.className = "symbol-glyph";
        glyphSpan.textContent = letterChar;

        const labelSpan = document.createElement("span");
        labelSpan.className = "symbol-label";
        labelSpan.textContent = `Letter (${charName})`;

        btn.appendChild(glyphSpan);
        btn.appendChild(labelSpan);
        grid.appendChild(btn);
      }
    }

    /**
     * Inserts the letter with Cambria Math font into active PowerPoint selection,
     * maintaining current font size, then reverts font back for subsequent typing.
     */
    async function insertFormattedLetter(letter) {
      try {
        await PowerPoint.run(async (context) => {
          // Get selection range in text box
          const selection = context.presentation.getSelectedTextRange();
          selection.load("font/name, font/size");
          await context.sync();

          // Store current slide text box font name
          const originalFontName = selection.font.name || "Calibri";

          // Insert symbol into selection
          const insertedRange = selection.insertText(letter, PowerPoint.InsertLocation.replace);
          
          // Apply Cambria Math font specifically to inserted letter
          insertedRange.font.name = "Cambria Math";
          await context.sync();

          // Insert empty space/cursor after letter and revert font name to original slide font
          const trailingRange = insertedRange.insertText("", PowerPoint.InsertLocation.after);
          trailingRange.font.name = originalFontName;
          await context.sync();
        });
      } catch (error) {
        // Fallback for basic Office JS insertion if PowerPoint API requirement set isn't fully supported
        Office.context.document.setSelectedDataAsync(
          letter,
          { coercionType: Office.CoercionType.Text },
          (result) => {
            if (result.status === Office.AsyncResultStatus.Failed) {
              console.error("Failed to insert letter: " + result.error.message);
            }
          }
        );
      }
    }
  </script>
</body>
</html>
