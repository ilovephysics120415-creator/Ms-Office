<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <title>Small Letters Pane</title>

  <!-- Office JavaScript API -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 12px;
      margin: 0;
      background-color: #f5f5f7;
      color: #333;
    }

    h3 {
      font-size: 14px;
      margin-top: 0;
      margin-bottom: 12px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .symbol-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px;
    }

    .symbol-btn {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      background-color: #ffffff;
      border: 1px solid #d1d1d6;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    .symbol-btn:hover {
      background-color: #007aff;
      color: #ffffff;
      border-color: #007aff;
    }

    .symbol-btn:active {
      transform: scale(0.97);
    }

    .symbol-glyph {
      font-family: "Cambria Math", serif;
      font-weight: bold;
      font-size: 18px;
      min-width: 20px;
      text-align: center;
    }

    .symbol-label {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <h3>Small Letters (\u{1D44E} - \u{1D467})</h3>

  <div class="symbol-grid">
    <button class="symbol-btn" onclick="insertFormattedLetter('\u{1D44E}')">
      <span class="symbol-glyph">&#x1D44E;</span>
      <span class="symbol-label">Letter (a)</span>
    </button>
    <button class="symbol-btn" onclick="insertFormattedLetter('\u{1D44F}')">
      <span class="symbol-glyph">&#x1D44F;</span>
      <span class="symbol-label">Letter (b)</span>
    </button>
    <button class="symbol-btn" onclick="insertFormattedLetter('\u{1D450}')">
      <span class="symbol-glyph">&#x1D450;</span>
      <span class="symbol-label">Letter (c)</span>
    </button>
    <button class="symbol-btn" onclick="insertFormattedLetter('\u{1D451}')">
      <span class="symbol-glyph">&#x1D451;</span>
      <span class="symbol-label">Letter (d)</span>
    </button>
    <button class="symbol-btn" onclick="insertFormattedLetter('\u{1D452}')">
      <span class="symbol-glyph">&#x1D452;</span>
      <span class="symbol-label">Letter (e)</span>
    </button>
    <button class="symbol-btn" onclick="insertFormattedLetter('\u{1D453}')">

    <button class="symbol-btn" onclick="insertFormattedLetter('\u{1D455}')">

    </button>
    <button class="symbol-btn" onclick="insertFormattedLetter('\u{1D456}')">

    <button class="symbol-btn" onclick="insertFormattedLetter('\u{1D457}')">

    </button>
    <button class="symbol-btn" onclick="insertFormattedLetter('\u{1D461}')">
      <span class="symbol-glyph">&#x1D461;</span>
      <span class="symbol-label">Letter (t)</span>
    </button>
    <button class="symbol-btn" onclick="insertFormattedLetter('\u{1D462}')">
      <span class="symbol-glyph">&#x1D462;</span>

    </button>
    <button class="symbol-btn" onclick="insertFormattedLetter('\u{1D467}')">
      <span class="symbol-glyph">&#x1D467;</span>
      <span class="symbol-label">Letter (z)</span>
    </button>
  </div>

  <script type="text/javascript">
    Office.onReady((info) => {
      if (info.host === Office.HostType.PowerPoint) {
        console.log("Small Letters Task Pane loaded in PowerPoint.");
      }
    });

    /**
     * Inserts the letter with Cambria Math font into active PowerPoint selection,
     * maintaining current font size, then reverts font back for subsequent typing.
     */
    async function insertFormattedLetter(letter) {
      try {
        await PowerPoint.run(async (context) => {
          // Get selection range in text box
          const selection = context.presentation.getSelectedTextRange();
          selection.load("font/name, font/size");
          await context.sync();

          // Store current slide text box font name
          const originalFontName = selection.font.name || "Calibri";

          // Insert symbol into selection
          const insertedRange = selection.insertText(letter, PowerPoint.InsertLocation.replace);
          
          // Apply Cambria Math font specifically to inserted letter
          insertedRange.font.name = "Cambria Math";
          await context.sync();

          // Insert empty space/cursor after letter and revert font name to original slide font
          const trailingRange = insertedRange.insertText("", PowerPoint.InsertLocation.after);
          trailingRange.font.name = originalFontName;
          await context.sync();
        });
      } catch (error) {
        // Fallback for basic Office JS insertion if PowerPoint API requirement set isn't fully supported
        Office.context.document.setSelectedDataAsync(
          letter,
          { coercionType: Office.CoercionType.Text },
          (result) => {
            if (result.status === Office.AsyncResultStatus.Failed) {
              console.error("Failed to insert letter: " + result.error.message);
            }
          }
        );
      }
    }
  </script>
</body>
</html>
