  <script type="text/javascript">
    Office.onReady((info) => {
      if (info.host === Office.HostType.PowerPoint) {
        console.log("Small Letters Task Pane loaded in PowerPoint.");
      }
    });

    async function insertFormattedLetter(letter) {
      try {
        await PowerPoint.run(async (context) => {
          const selection = context.presentation.getSelectedTextRange();
          selection.load("font/name, font/size");
          await context.sync();

          const originalFontName = selection.font.name || "Calibri";

          const insertedRange = selection.insertText(letter, PowerPoint.InsertLocation.replace);
          insertedRange.font.name = "Cambria Math";
          await context.sync();

          const trailingRange = insertedRange.insertText("", PowerPoint.InsertLocation.after);
          trailingRange.font.name = originalFontName;
          await context.sync();
        });
      } catch (error) {
        Office.context.document.setSelectedDataAsync(
          letter,
          { coercionType: Office.CoercionType.Text },
          (result) => {
            if (result.status === Office.AsyncResultStatus.Failed) {
              console.error("Failed to insert letter: " + result.error.message);
            }
          }
        );
      }
    }
  </script>
