<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <title>Insert Character Commands</title>
    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>
<body>
    <script type="text/javascript">
        Office.onReady(() => {
            // Office is ready. Functions registered on window are accessible via ExecuteFunction in manifest.
        });

        // Unicode mathematical italic letters mapping (\u{1D434} for 'A' through \u{1D44D} for 'Z')
        const charMap = {
            'actionInsertA': '\u{1D434}',
            'actionInsertB': '\u{1D435}',
            'actionInsertC': '\u{1D436}',
            'actionInsertD': '\u{1D437}',
            'actionInsertE': '\u{1D438}',
            'actionInsertF': '\u{1D439}',
            'actionInsertG': '\u{1D43A}',
            'actionInsertH': '\u{1D43B}',
            'actionInsertI': '\u{1D43C}',
            'actionInsertJ': '\u{1D43D}',
            'actionInsertK': '\u{1D43E}',
            'actionInsertL': '\u{1D43F}',
            'actionInsertM': '\u{1D440}',
            'actionInsertN': '\u{1D441}',
            'actionInsertO': '\u{1D442}',
            'actionInsertP': '\u{1D443}',
            'actionInsertQ': '\u{1D444}',
            'actionInsertR': '\u{1D445}',
            'actionInsertS': '\u{1D446}',
            'actionInsertT': '\u{1D447}',
            'actionInsertU': '\u{1D448}',
            'actionInsertV': '\u{1D449}',
            'actionInsertW': '\u{1D44A}',
            'actionInsertX': '\u{1D44B}',
            'actionInsertY': '\u{1D44C}',
            'actionInsertZ': '\u{1D44D}'
        };

        /**
         * Inserts a character at the current text cursor position in PowerPoint.
         * Only inserts when a real text cursor/selection exists inside a text box;
         * otherwise does nothing (no destructive fallback), to avoid overwriting
         * a text frame's contents when only the shape itself is selected.
         *
         * Note: PowerPoint can report the "selected range" as spanning the last
         * word typed (not just a blinking cursor) when a ribbon button is clicked
         * right after typing. To avoid ever overwriting that word, we don't set
         * .text on the reported range directly - we collapse it to a zero-length
         * range at its own end point first, then insert only into that.
         */
        function insertFormattedLetter(char) {
            return PowerPoint.run(async (context) => {
                const range = context.presentation.getSelectedTextRangeOrNullObject();
                range.load("length");
                await context.sync();

                if (range.isNullObject) {
                    console.warn("No text cursor found. Click inside a text box first, then try again.");
                    return;
                }

                // Zero-length range positioned right after whatever PowerPoint
                // reported as selected - guarantees a pure insert, never a replace.
                const insertionPoint = range.getSubstring(range.length, 0);
                insertionPoint.text = char;
                await context.sync();
            }).catch((error) => {
                console.error("Could not insert character:", error);
            });
        }

        /**
         * Dynamically generates action handlers (actionInsertA - actionInsertZ)
         * exposed globally to the window object for manifest ExecuteFunction actions.
         */
        Object.keys(charMap).forEach((functionName) => {
            window[functionName] = function (event) {
                const characterToInsert = charMap[functionName];

                insertFormattedLetter(characterToInsert)
                    .catch((err) => console.error("Execution error:", err))
                    .finally(() => {
                        // Signal to PowerPoint that the ribbon command execution is complete
                        if (event && typeof event.completed === "function") {
                            event.completed();
                        }
                    });
            };
        });
    </script>
</body>
</html>
