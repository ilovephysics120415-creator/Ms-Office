<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Quick Tools - Function File</title>

  <!-- Office.js: required for Office.onReady / Office.actions.associate -->
  <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

  <script type="text/javascript">

    Office.onReady(() => {
      // ---- Shape buttons (Group_Shapes) ----
      Office.actions.associate("actionInsertShapeCircle", actionInsertShapeCircle);
      Office.actions.associate("actionInsertShapeSquare", actionInsertShapeSquare);
      Office.actions.associate("actionInsertShapeRectangle", actionInsertShapeRectangle);
      Office.actions.associate("actionInsertShapeTriangle", actionInsertShapeTriangle);
      Office.actions.associate("actionInsertShapeRightTriangle", actionInsertShapeRightTriangle);
      Office.actions.associate("actionInsertShapeDiamond", actionInsertShapeDiamond);
      Office.actions.associate("actionInsertShapeEllipse", actionInsertShapeEllipse);
      Office.actions.associate("actionInsertShapeParallelogram", actionInsertShapeParallelogram);
      Office.actions.associate("actionInsertShapeTrapezoid", actionInsertShapeTrapezoid);
      Office.actions.associate("actionInsertShapeLine", actionInsertShapeLine);
      Office.actions.associate("actionInsertShapeCylinder", actionInsertShapeCylinder);

      // ---- Character/letter/symbol buttons (Symbols, Small Letter, Big Letter groups) ----
      Object.keys(charMap).forEach((functionName) => {
        Office.actions.associate(functionName, makeCharHandler(functionName));
      });

      console.log("Office initialized successfully. Registered", 11 + Object.keys(charMap).length, "functions.");
    });

    // =====================================================================
    // SHAPES
    // =====================================================================

    // Default placement/size for every inserted shape, in points.
    // Adjust freely - these just avoid every shape landing exactly on top
    // of the last one at (0,0).
    const DEFAULT_OPTIONS = { left: 100, top: 100, height: 120, width: 120 };

    /**
     * Shared helper: inserts a geometric shape of the given GeometricShapeType
     * onto the active slide.
     * @param {Office.AddinCommands.Event} event
     * @param {string} shapeType - a PowerPoint.GeometricShapeType value
     * @param {string} shapeName - friendly name to assign to the new shape
     * @param {object} [options] - override for left/top/height/width
     */
    async function insertGeometricShape(event, shapeType, shapeName, options) {
      try {
        await PowerPoint.run(async (context) => {
          const shapes = context.presentation.getSelectedSlides().getItemAt(0).shapes;
          const shape = shapes.addGeometricShape(shapeType, options || DEFAULT_OPTIONS);
          shape.name = shapeName;
          await context.sync();
        });
      } catch (error) {
        console.error(`insertGeometricShape (${shapeName}) failed:`, error);
      } finally {
        event.completed();
      }
    }

    async function actionInsertShapeCircle(event) {
      // No dedicated "Circle" enum value - a circle is an Ellipse
      // with equal width and height.
      await insertGeometricShape(
        event,
        PowerPoint.GeometricShapeType.ellipse,
        "Circle",
        { left: 100, top: 100, height: 120, width: 120 }
      );
    }

    async function actionInsertShapeSquare(event) {
      // No dedicated "Square" enum value - a square is a Rectangle
      // with equal width and height.
      await insertGeometricShape(
        event,
        PowerPoint.GeometricShapeType.rectangle,
        "Square",
        { left: 100, top: 100, height: 120, width: 120 }
      );
    }

    async function actionInsertShapeRectangle(event) {
      await insertGeometricShape(
        event,
        PowerPoint.GeometricShapeType.rectangle,
        "Rectangle",
        { left: 100, top: 100, height: 90, width: 160 }
      );
    }

    async function actionInsertShapeTriangle(event) {
      // "Triangle" in the API is the isosceles triangle.
      await insertGeometricShape(event, PowerPoint.GeometricShapeType.triangle, "Triangle");
    }

    async function actionInsertShapeRightTriangle(event) {
      await insertGeometricShape(
        event,
        PowerPoint.GeometricShapeType.rightTriangle,
        "RightTriangle"
      );
    }

    async function actionInsertShapeDiamond(event) {
      await insertGeometricShape(event, PowerPoint.GeometricShapeType.diamond, "Diamond");
    }

    async function actionInsertShapeEllipse(event) {
      await insertGeometricShape(
        event,
        PowerPoint.GeometricShapeType.ellipse,
        "Ellipse",
        { left: 100, top: 100, height: 90, width: 160 }
      );
    }

    async function actionInsertShapeParallelogram(event) {
      await insertGeometricShape(
        event,
        PowerPoint.GeometricShapeType.parallelogram,
        "Parallelogram"
      );
    }

    async function actionInsertShapeTrapezoid(event) {
      await insertGeometricShape(event, PowerPoint.GeometricShapeType.trapezoid, "Trapezoid");
    }

    async function actionInsertShapeCylinder(event) {
      // Cylinder has no "Cylinder" enum value - the API calls it "Can".
      await insertGeometricShape(event, PowerPoint.GeometricShapeType.can, "Cylinder");
    }

    // Line is not a GeometricShapeType at all - it uses the separate
    // addLine() method with a ConnectorType, not addGeometricShape().
    async function actionInsertShapeLine(event) {
      try {
        await PowerPoint.run(async (context) => {
          const shapes = context.presentation.getSelectedSlides().getItemAt(0).shapes;
          // For a line: left/top = start point, height/width = end point
          // (NOT literal height/width - see Microsoft's "Work with shapes" doc).
          const line = shapes.addLine(PowerPoint.ConnectorType.straight, {
            left: 100,
            top: 100,
            height: 20,
            width: 150,
          });
          line.name = "Line";
          await context.sync();
        });
      } catch (error) {
        console.error("actionInsertShapeLine failed:", error);
      } finally {
        event.completed();
      }
    }

    // =====================================================================
    // CHARACTERS (letters, Greek/scientific symbols)
    // =====================================================================

    // Unicode mathematical italic letters mapping (\u{1D434} for 'A' through \u{1D44D} for 'Z')
    const charMap = {
      'actionInsertA': '\u{1D434}',
      'actionInsertB': '\u{1D435}',
      'actionInsertC': '\u{1D436}',
      'actionInsertD': '\u{1D437}',
      'actionInsertE': '\u{1D438}',
      'actionInsertF': '\u{1D439}',
      'actionInsertG': '\u{1D43A}',
      'actionInsertH': '\u{1D43B}',
      'actionInsertI': '\u{1D43C}',
      'actionInsertJ': '\u{1D43D}',
      'actionInsertK': '\u{1D43E}',
      'actionInsertL': '\u{1D43F}',
      'actionInsertM': '\u{1D440}',
      'actionInsertN': '\u{1D441}',
      'actionInsertO': '\u{1D442}',
      'actionInsertP': '\u{1D443}',
      'actionInsertQ': '\u{1D444}',
      'actionInsertR': '\u{1D445}',
      'actionInsertS': '\u{1D446}',
      'actionInsertT': '\u{1D447}',
      'actionInsertU': '\u{1D448}',
      'actionInsertV': '\u{1D449}',
      'actionInsertW': '\u{1D44A}',
      'actionInsertX': '\u{1D44B}',
      'actionInsertY': '\u{1D44C}',
      'actionInsertZ': '\u{1D44D}',

      // Small Mathematical Italic Letters
      'actionInsertSmallA': '\u{1D44E}',
      'actionInsertSmallB': '\u{1D44F}',
      'actionInsertSmallC': '\u{1D450}',
      'actionInsertSmallD': '\u{1D451}',
      'actionInsertSmallE': '\u{1D452}',
      'actionInsertSmallF': '\u{1D453}',
      'actionInsertSmallG': '\u{1D454}',
      'actionInsertSmallH': '\u{210E}',   // Special case: Planck constant symbol / Mathematical italic h
      'actionInsertSmallI': '\u{1D456}',
      'actionInsertSmallJ': '\u{1D457}',
      'actionInsertSmallK': '\u{1D458}',
      'actionInsertSmallL': '\u{1D459}',
      'actionInsertSmallM': '\u{1D45A}',
      'actionInsertSmallN': '\u{1D45B}',
      'actionInsertSmallO': '\u{1D45C}',
      'actionInsertSmallP': '\u{1D45D}',
      'actionInsertSmallQ': '\u{1D45E}',
      'actionInsertSmallR': '\u{1D45F}',
      'actionInsertSmallS': '\u{1D460}',
      'actionInsertSmallT': '\u{1D461}',
      'actionInsertSmallU': '\u{1D462}',
      'actionInsertSmallV': '\u{1D463}',
      'actionInsertSmallW': '\u{1D464}',
      'actionInsertSmallX': '\u{1D465}',
      'actionInsertSmallY': '\u{1D466}',
      'actionInsertSmallZ': '\u{1D467}',

      // Greek & Scientific Symbols
      'actionInsertAlpha': '\u03B1',
      'actionInsertBeta': '\u03B2',
      'actionInsertLambda': '\u03BB',
      'actionInsertDegree': '\u00B0',
      'actionInsertDegreeCelsius': '\u00B0C',
      'actionInsertFrequency': '\u{1D453}',
      'actionInsertGamma': '\u03B3',
      'actionInsertTheta': '\u03B8',
      'actionInsertOhm': '\u2126',
      'actionInsertPi': '\u03C0',
      'actionInsertRho': '\u03C1',
      'actionInsertMu': '\u03BC'
    };

    /**
     * Inserts a character at the cursor position, formatted in Cambria Math,
     * followed by a space in the slide's normal font so subsequent typing
     * isn't stuck in Cambria Math.
     *
     * Note: PowerPoint.TextRange has no insertText() method (unlike
     * Word.Range) - the only way to add text is to rebuild the .text
     * property directly.
     */
    function insertFormattedLetter(char) {
      return PowerPoint.run(async (context) => {
        const range = context.presentation.getSelectedTextRangeOrNullObject();
        range.load("text");
        range.font.load("name");
        await context.sync();

        if (range.isNullObject) {
          // Get the current slide and add a new text box pre-filled with the character
          const slide = context.presentation.getSelectedSlides().getItem(0);
          slide.shapes.addTextField(char);
          await context.sync();
          return;
        }

        const originalFontName = range.font.name;   // font in effect at the cursor
        const insertAt = range.text.length;          // position where char will land

        // Append the character plus a trailing space (no insertText() available)
        range.text = range.text + char + " ";
        await context.sync();

        // Format only the inserted character as Cambria Math
        const charRange = range.getSubstring(insertAt, char.length);
        charRange.font.name = "Cambria Math";

        // Format the trailing space back to the original slide font
        const spaceRange = range.getSubstring(insertAt + char.length, 1);
        spaceRange.font.name = originalFontName;

        // Park the cursor right after the space, ready for normal typing
        const cursorRange = range.getSubstring(insertAt + char.length + 1, 0);
        cursorRange.setSelected();

        await context.sync();
      });
    }

    /**
     * Builds an ExecuteFunction handler for a given charMap entry.
     * (Wrapped in a factory so each handler closes over its own functionName.)
     */
    function makeCharHandler(functionName) {
      return function (event) {
        const characterToInsert = charMap[functionName];
        insertFormattedLetter(characterToInsert)
          .catch((err) => console.error(`${functionName} failed:`, err))
          .finally(() => {
            if (event && typeof event.completed === "function") {
              event.completed();
            }
          });
      };
    }

  </script>
</head>
<body>
  <!--
    This page is never shown to the user. It is the add-in's single "function
    file": a hidden page loaded in the background whose job is to associate
    every ExecuteFunction FunctionName declared in the manifest (shapes,
    letters, Greek/scientific symbols) with the JS handler that runs it.

    IMPORTANT: PowerPoint loads exactly one FunctionFile per host
    (<FunctionFile resid="Url.insertShape" /> in the manifest). Any handler
    not registered on THIS page will silently fail when its ribbon button is
    clicked - so shape handlers and character handlers must both live here.
  -->
</body>
</html>
