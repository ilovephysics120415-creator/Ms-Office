<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <title>Insert Character Commands</title>
    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>
<body>
    <script type="text/javascript">
        Office.onReady(() => {
            // Office is ready. Functions registered on window are accessible via ExecuteFunction in manifest.
        });

        // Unicode mathematical italic letters mapping (\u{1D434} for 'A' through \u{1D44D} for 'Z')
        const charMap = {
            'actionInsertA': '\u{1D434}',
            'actionInsertB': '\u{1D435}',
            'actionInsertC': '\u{1D436}',
            'actionInsertD': '\u{1D437}',
            'actionInsertE': '\u{1D438}',
            'actionInsertF': '\u{1D439}',
            'actionInsertG': '\u{1D43A}',
            'actionInsertH': '\u{1D43B}',
            'actionInsertI': '\u{1D43C}',
            'actionInsertJ': '\u{1D43D}',
            'actionInsertK': '\u{1D43E}',
            'actionInsertL': '\u{1D43F}',
            'actionInsertM': '\u{1D440}',
            'actionInsertN': '\u{1D441}',
            'actionInsertO': '\u{1D442}',
            'actionInsertP': '\u{1D443}',
            'actionInsertQ': '\u{1D444}',
            'actionInsertR': '\u{1D445}',
            'actionInsertS': '\u{1D446}',
            'actionInsertT': '\u{1D447}',
            'actionInsertU': '\u{1D448}',
            'actionInsertV': '\u{1D449}',
            'actionInsertW': '\u{1D44A}',
            'actionInsertX': '\u{1D44B}',
            'actionInsertY': '\u{1D44C}',
            'actionInsertZ': '\u{1D44D}',

            // Small Mathematical Italic Letters
            'actionInserta': '\u{1D44E}',
            'actionInsertb': '\u{1D44F}',
            'actionInsertc': '\u{1D450}',
            'actionInsertd': '\u{1D451}',
            'actionInserte': '\u{1D452}',
            'actionInsertf': '\u{1D453}',
            'actionInsertg': '\u{1D454}',
            'actionInserth': '\u{210E}',   // Special case: Planck constant symbol / Mathematical italic h
            'actionInserti': '\u{1D456}',
            'actionInsertj': '\u{1D457}',
            'actionInsertk': '\u{1D458}',
            'actionInsertl': '\u{1D459}',
            'actionInsertm': '\u{1D45A}',
            'actionInsertn': '\u{1D45B}',
            'actionInserto': '\u{1D45C}',
            'actionInsertp': '\u{1D45D}',
            'actionInsertq': '\u{1D45E}',
            'actionInsertr': '\u{1D45F}',
            'actionInserts': '\u{1D460}',
            'actionInsertt': '\u{1D461}',
            'actionInsertu': '\u{1D462}',
            'actionInsertv': '\u{1D463}',
            'actionInsertw': '\u{1D464}',
            'actionInsertx': '\u{1D465}',
            'actionInserty': '\u{1D466}',
            'actionInsertz': '\u{1D467}',

            // Greek & Scientific Symbols
            'actionInsertAlpha': '\u{1D6C2}',
            'actionInsertBeta': '\u{1D6C3}',
            'actionInsertLambda': '\u{1D6DA}',
            'actionInsertDegree': '\u00B0',
            'actionInsertDegreeCelsius': '\u2103',
            'actionInsertFrequency': '\u{1D453}',
            'actionInsertGamma': '\u{1D6C4}',
            'actionInsertTheta': '\u{1D6D0}',
            'actionInsertOhm': '\u2126',
            'actionInsertPi': '\u{1D6E1}',
            'actionInsertRho': '\u{1D6E0}'            
        };

        /**
         * Inserts a character at the end of the current selection point
         * without overwriting existing text.
         */
        function insertFormattedLetter(char) {
            return PowerPoint.run(async (context) => {
                const range = context.presentation.getSelectedTextRangeOrNullObject();
                range.load("text");
                await context.sync();

                if (range.isNullObject) {
                    // Get the current slide and add a new text box pre-filled with the character
                    const slide = context.presentation.getSelectedSlides().getItem(0);
                    slide.shapes.addTextField(char);
                    await context.sync();
                    return;
                }

                // "End" inserts the text right after the selection point, preserving existing text
                //range.insertText(char, "End");
                range.text=range.text+char;
                await context.sync();
            }).catch((error) => {
                console.error("Could not insert character:", error);
            });
        }


        /**
         * Dynamically generates action handlers (actionInsertA - actionInsertZ)
         * exposed globally to the window object for manifest ExecuteFunction actions.
         */
        Object.keys(charMap).forEach((functionName) => {
            window[functionName] = function (event) {
                const characterToInsert = charMap[functionName];

                insertFormattedLetter(characterToInsert)
                    .catch((err) => console.error("Execution error:", err))
                    .finally(() => {
                        // Signal to PowerPoint that the ribbon command execution is complete
                        if (event && typeof event.completed === "function") {
                            event.completed();
                        }
                    });
            };
        });
    </script>
</body>
</html>
