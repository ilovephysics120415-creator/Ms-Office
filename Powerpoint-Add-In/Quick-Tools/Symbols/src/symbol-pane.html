<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <title>Symbols Pane</title>
    <!-- Office.js SDK -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 12px;
            margin: 0;
            background-color: #f8f9fa;
        }
        h3 {
            font-size: 14px;
            color: #333;
            margin-top: 0;
            margin-bottom: 12px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 6px;
        }
        .symbol-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .symbol-btn {
            background-color: #ffffff;
            border: 1px solid #cccccc;
            border-radius: 4px;
            padding: 10px 4px;
            font-size: 16px;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s ease;
            font-family: 'Cambria Math', 'Segoe UI Symbol', sans-serif;
        }
        .symbol-btn:hover {
            background-color: #e9ecef;
            border-color: #0078d4;
            color: #0078d4;
        }
        .symbol-btn:active {
            background-color: #c8e1ff;
        }
        .symbol-label {
            display: block;
            font-size: 10px;
            color: #666;
            font-family: sans-serif;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <h3>Common Symbols</h3>
    <div class="symbol-grid">
        <button class="symbol-btn" onclick="insertSymbol('α')">α<span class="symbol-label">alpha</span></button>
        <button class="symbol-btn" onclick="insertSymbol('β')">β<span class="symbol-label">beta</span></button>
        <button class="symbol-btn" onclick="insertSymbol('λ')">λ<span class="symbol-label">lambda</span></button>
        <button class="symbol-btn" onclick="insertSymbol('°')">°<span class="symbol-label">degree</span></button>
        <button class="symbol-btn" onclick="insertSymbol('°C')">°C<span class="symbol-label">deg C</span></button>
        <button class="symbol-btn" onclick="insertSymbol('\u{1D453}')">&#x1D453;<span class="symbol-label">freq (f)</span></button>
        <button class="symbol-btn" onclick="insertSymbol('γ')">γ<span class="symbol-label">gamma</span></button>
        <button class="symbol-btn" onclick="insertSymbol('θ')">θ<span class="symbol-label">theta</span></button>
        <button class="symbol-btn" onclick="insertSymbol('∣')">∣<span class="symbol-label">mid</span></button>
        <button class="symbol-btn" onclick="insertSymbol('Ω')">Ω<span class="symbol-label">ohm</span></button>
        <button class="symbol-btn" onclick="insertSymbol('π')">π<span class="symbol-label">pi</span></button>
        <button class="symbol-btn" onclick="insertSymbol('ρ')">ρ<span class="symbol-label">rho</span></button>
    </div>

    <script>
        Office.onReady((info) => {
            if (info.host === Office.HostType.PowerPoint) {
                console.log("PowerPoint Add-in loaded successfully.");
            }
        });

        function insertSymbol(symbolText) {
            // Office.CoercionType.Text inserts right at active cursor or selected text
            Office.context.document.setSelectedDataAsync(
                symbolText,
                { coercionType: Office.CoercionType.Text },
                function (asyncResult) {
                    if (asyncResult.status === Office.AsyncResultStatus.Failed) {
                        console.error("Failed to insert symbol: " + asyncResult.error.message);
                    } else {
                        console.log("Successfully inserted symbol: " + symbolText);
                    }
                }
            );
        }
    </script>
</body>
</html>
