<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <title>Symbol Pane</title>

  <!-- Office JavaScript API -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 12px;
      margin: 0;
      background-color: #f5f5f7;
      color: #333;
    }

    h3 {
      font-size: 14px;
      margin-top: 0;
      margin-bottom: 12px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .symbol-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px;
    }

    .symbol-btn {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      background-color: #ffffff;
      border: 1px solid #d1d1d6;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    .symbol-btn:hover {
      background-color: #007aff;
      color: #ffffff;
      border-color: #007aff;
    }

    .symbol-btn:active {
      transform: scale(0.97);
    }

    .symbol-glyph {
      font-weight: bold;
      font-size: 16px;
      min-width: 20px;
      text-align: center;
    }

    .symbol-label {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <h3>Insert Symbol</h3>

  <div class="symbol-grid">
    <button class="symbol-btn" onclick="insertSymbol('\u03B1')">
      <span class="symbol-glyph">&alpha;</span>
      <span class="symbol-label">Alpha</span>
    </button>

    <button class="symbol-btn" onclick="insertSymbol('\u03B2')">
      <span class="symbol-glyph">&beta;</span>
      <span class="symbol-label">Beta</span>
    </button>

    <button class="symbol-btn" onclick="insertSymbol('\u03BB')">
      <span class="symbol-glyph">&lambda;</span>
      <span class="symbol-label">Lambda</span>
    </button>

    <button class="symbol-btn" onclick="insertSymbol('\u00B0')">
      <span class="symbol-glyph">&deg;</span>
      <span class="symbol-label">Degree</span>
    </button>

    <button class="symbol-btn" onclick="insertSymbol('\u2103')">
      <span class="symbol-glyph">&#8451;</span>
      <span class="symbol-label">Degree Celsius</span>
    </button>

    <button class="symbol-btn" onclick="insertSymbol('\u{1D453}')">
      <span class="symbol-glyph">&#x1D453;</span>
      <span class="symbol-label">Frequency (f)</span>
    </button>

<button class="symbol-btn" onclick="insertSymbol('\u03F3')">
  <span class="symbol-glyph" style="font-family: 'Cambria Math', serif;">&gamma;</span>
  <span class="symbol-label">Gamma</span>
</button>

    <button class="symbol-btn" onclick="insertSymbol('\u03B8')">
      <span class="symbol-glyph">&theta;</span>
      <span class="symbol-label">Theta</span>
    </button>

    <button class="symbol-btn" onclick="insertSymbol('\u2126')">
      <span class="symbol-glyph">&#8486;</span>
      <span class="symbol-label">Ohm</span>
    </button>

    <button class="symbol-btn" onclick="insertSymbol('\u03C0')">
      <span class="symbol-glyph">&pi;</span>
      <span class="symbol-label">Pi</span>
    </button>

    <button class="symbol-btn" onclick="insertSymbol('\u03C1')">
      <span class="symbol-glyph">&rho;</span>
      <span class="symbol-label">Rho</span>
    </button>
  </div>

  <script type="text/javascript">
    Office.onReady((info) => {
      if (info.host === Office.HostType.PowerPoint) {
        console.log("Symbol Task Pane loaded in PowerPoint.");
      }
    });

    /**
     * Inserts the given text/symbol into the user's active cursor selection in PowerPoint.
     * @param {string} symbol - The symbol string to insert.
     */
    function insertSymbol(symbol) {
      Office.context.document.setSelectedDataAsync(
        symbol,
        { coercionType: Office.CoercionType.Text },
        function (asyncResult) {
          if (asyncResult.status === Office.AsyncResultStatus.Failed) {
            console.error("Failed to insert symbol: " + asyncResult.error.message);
          }
        }
      );
    }
  </script>
</body>
</html>
