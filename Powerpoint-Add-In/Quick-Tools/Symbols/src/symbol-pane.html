<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <title>Symbol Pane</title>

  <!-- Office JavaScript API -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 12px;
      margin: 0;
      background-color: #f5f5f7;
      color: #333;
    }

    h3 {
      font-size: 14px;
      margin-top: 0;
      margin-bottom: 12px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .symbol-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px;
    }

    .symbol-btn {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      background-color: #ffffff;
      border: 1px solid #d1d1d6;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    .symbol-btn:hover {
      background-color: #007aff;
      color: #ffffff;
      border-color: #007aff;
    }

    .symbol-btn:active {
      transform: scale(0.97);
    }

    .symbol-glyph {
      font-weight: bold;
      font-size: 16px;
      min-width: 20px;
      text-align: center;
    }

    .math-font {
      font-family: 'Cambria Math', 'STIX Two Math', 'Times New Roman', serif;
      font-style: italic;
    }

    .symbol-label {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <h3>Insert Symbol</h3>

  <div class="symbol-grid">
    <button class="symbol-btn" onclick="insertSymbol('\u03B1', 'Cambria Math', true)">
      <span class="symbol-glyph math-font">&alpha;</span>
      <span class="symbol-label">Alpha</span>
    </button>

    <button class="symbol-btn" onclick="insertSymbol('\u03B2', 'Cambria Math', true)">
      <span class="symbol-glyph math-font">&beta;</span>
      <span class="symbol-label">Beta</span>
    </button>

    <button class="symbol-btn" onclick="insertSymbol('\u03BB', 'Cambria Math', true)">
      <span class="symbol-glyph math-font">&lambda;</span>
      <span class="symbol-label">Lambda</span>
    </button>

    <button class="symbol-btn" onclick="insertSymbol('\u00B0', null, false)">
      <span class="symbol-glyph">&deg;</span>
      <span class="symbol-label">Degree</span>
    </button>

    <!-- Degree Celsius (passes null so °C inherits slide font) -->
    <button class="symbol-btn" onclick="insertSymbol('\u00B0C', null, false)">
      <span class="symbol-glyph">&deg;C</span>
      <span class="symbol-label">Degree Celsius</span>
    </button>

    <button class="symbol-btn" onclick="insertSymbol('\u{1D453}', 'Cambria Math', true)">
      <span class="symbol-glyph math-font">&#x1D453;</span>
      <span class="symbol-label">Frequency (f)</span>
    </button>

    <button class="symbol-btn" onclick="insertSymbol('\u03B3', 'Cambria Math', true)">
      <span class="symbol-glyph math-font">&gamma;</span>
      <span class="symbol-label">Gamma</span>
    </button>

    <button class="symbol-btn" onclick="insertSymbol('\u03B8', 'Cambria Math', true)">
      <span class="symbol-glyph math-font">&theta;</span>
      <span class="symbol-label">Theta</span>
    </button>

    <button class="symbol-btn" onclick="insertSymbol('\u2126', 'Cambria Math', false)">
      <span class="symbol-glyph">&#8486;</span>
      <span class="symbol-label">Ohm</span>
    </button>

    <button class="symbol-btn" onclick="insertSymbol('\u03C0', 'Cambria Math', true)">
      <span class="symbol-glyph math-font">&pi;</span>
      <span class="symbol-label">Pi</span>
    </button>

    <button class="symbol-btn" onclick="insertSymbol('\u03C1', 'Cambria Math', true)">
      <span class="symbol-glyph math-font">&rho;</span>
      <span class="symbol-label">Rho</span>
    </button>
  </div>

  <script type="text/javascript">
    Office.onReady((info) => {
      if (info.host === Office.HostType.PowerPoint) {
        console.log("Symbol Task Pane loaded in PowerPoint.");
      }
    });

    /**
     * Inserts the given text/symbol, restores original font settings, and appends a trailing space.
     * @param {string} symbol - The symbol string to insert.
     * @param {string|null} fontName - Font family to apply (e.g. 'Cambria Math'), or null to keep text box default.
     * @param {boolean} isItalic - Whether to force italic styling on the inserted symbol.
     */
async function insertSymbol(symbol, fontName = 'Cambria Math', isItalic = true) {
      try {
        await PowerPoint.run(async (context) => {
          const selection = context.presentation.getSelectedTextRange();
          selection.load("font/name, font/italic");
          await context.sync();

          // Save original formatting (fallback to slide default if empty)
          const originalFontName = selection.font.name || "Calibri";
          const originalItalic = selection.font.italic ?? false;

          // 1. Insert the symbol and apply requested symbol font
          const insertedSymbol = selection.insertText(symbol, PowerPoint.InsertLocation.replace);
          if (fontName) {
            insertedSymbol.font.name = fontName;
          }
          insertedSymbol.font.italic = isItalic;
          await context.sync();

          // 2. Insert trailing space character after the symbol
          const spaceRange = insertedSymbol.insertText(" ", PowerPoint.InsertLocation.after);
          await context.sync();

          // 3. Highlight/Select the space character specifically and apply original font properties
          spaceRange.select(PowerPoint.SelectionPosition.all);
          const activeSpace = context.presentation.getSelectedTextRange();
          activeSpace.font.name = originalFontName;
          activeSpace.font.italic = originalItalic;
          await context.sync();

          // 4. Move the cursor after the formatted space character
          activeSpace.select(PowerPoint.SelectionPosition.end);
          await context.sync();
        });
      } catch (error) {
        // Fallback using Common API
        Office.context.document.setSelectedDataAsync(
          symbol + " ",
          { coercionType: Office.CoercionType.Text },
          (result) => {
            if (result.status === Office.AsyncResultStatus.Failed) {
              console.error("Failed to insert symbol: " + result.error.message);
            }
          }
        );
      }
    }
  </script>
</body>
</html>
