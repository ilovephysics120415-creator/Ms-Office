  <title>Quick Tools for Word - Function File</title>
  <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script type="text/javascript">

    Office.onReady(() => {
      Object.keys(charMap).forEach((functionName) => {
        Office.actions.associate(functionName, makeCharHandler(functionName));
      });

      'actionInsertRightArrow': '\u27F6',

      'actionInsertReversibleArrow': '\u21CC'
    };

    /**
     * Inserts a character at the cursor (replacing any selection) in Cambria Math,
     * then a trailing space in the user's original font, and puts the cursor
     * after that space so typing continues in the normal font.
     */
    function insertFormattedLetter(char) {
      return Word.run(async (context) => {
        const sel = context.document.getSelection();
        sel.font.load("name");
        await context.sync();
        const originalFont = sel.font.name;   // may be "" if the selection mixes fonts

        const charRange = sel.insertText(char, "Replace");
        charRange.font.name = "Cambria Math";

        const spaceRange = charRange.insertText(" ", "After");
        if (originalFont) {
          spaceRange.font.name = originalFont;
        }

        spaceRange.select("End");
        await context.sync();
      });
    }

    function makeCharHandler(functionName) {
      return function (event) {
        insertFormattedLetter(charMap[functionName])
          .catch((err) => console.error(functionName + " failed:", err))
          .finally(() => {
            if (event && typeof event.completed === "function") event.completed();
          });
      };
    }
  </script>
