<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <title>Small Letters Pane</title>
    <!-- Office.js SDK -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 12px;
            margin: 0;
            background-color: #f8f9fa;
        }
        h3 {
            font-size: 14px;
            color: #333;
            margin-top: 0;
            margin-bottom: 12px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 6px;
        }
        .info-note {
            font-size: 11px;
            color: #d9534f;
            background-color: #fdf7f7;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
            padding: 6px 8px;
            margin-bottom: 12px;
            font-family: sans-serif;
        }
        .symbol-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .symbol-btn {
            background-color: #ffffff;
            border: 1px solid #cccccc;
            border-radius: 4px;
            padding: 8px 2px;
            font-size: 16px;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s ease;
            font-family: 'Cambria Math', 'Segoe UI Symbol', sans-serif;
        }
        .symbol-btn:hover {
            background-color: #e9ecef;
            border-color: #0078d4;
            color: #0078d4;
        }
        .symbol-btn:active {
            background-color: #c8e1ff;
        }
        .symbol-label {
            display: block;
            font-size: 10px;
            color: #666;
            font-family: sans-serif;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <h3>Math Small Letters (a-z)</h3>
    <div class="info-note">
        Note: h has to be manually inserted using equation
    </div>
    <div class="symbol-grid">
        <button class="symbol-btn" onclick="insertLetter('\u{1D44E}')">&#x1D44E;<span class="symbol-label">a</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D44F}')">&#x1D44F;<span class="symbol-label">b</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D450}')">&#x1D450;<span class="symbol-label">c</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D451}')">&#x1D451;<span class="symbol-label">d</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D452}')">&#x1D452;<span class="symbol-label">e</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D453}')">&#x1D453;<span class="symbol-label">f</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D454}')">&#x1D454;<span class="symbol-label">g</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D456}')">&#x1D456;<span class="symbol-label">i</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D457}')">&#x1D457;<span class="symbol-label">j</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D458}')">&#x1D458;<span class="symbol-label">k</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D459}')">&#x1D459;<span class="symbol-label">l</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D45A}')">&#x1D45A;<span class="symbol-label">m</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D45B}')">&#x1D45B;<span class="symbol-label">n</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D45C}')">&#x1D45C;<span class="symbol-label">o</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D45D}')">&#x1D45D;<span class="symbol-label">p</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D45E}')">&#x1D45E;<span class="symbol-label">q</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D45F}')">&#x1D45F;<span class="symbol-label">r</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D460}')">&#x1D460;<span class="symbol-label">s</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D461}')">&#x1D461;<span class="symbol-label">t</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D462}')">&#x1D462;<span class="symbol-label">u</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D463}')">&#x1D463;<span class="symbol-label">v</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D464}')">&#x1D464;<span class="symbol-label">w</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D465}')">&#x1D465;<span class="symbol-label">x</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D466}')">&#x1D466;<span class="symbol-label">y</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D467}')">&#x1D467;<span class="symbol-label">z</span></button>
    </div>

    <script>
        Office.onReady((info) => {
            if (info.host === Office.HostType.Word) {
                console.log("Small Letters Pane loaded successfully.");
            }
        });

        async function insertLetter(letterChar) {
            await Word.run(async (context) => {
                const selection = context.document.getSelection();
                selection.font.load(["size"]);
                await context.sync();

                const originalFontSize = selection.font.size;

                const insertedRange = selection.insertText(letterChar, Word.InsertLocation.replace);
                insertedRange.font.name = "Cambria Math";
                if (originalFontSize) {
                    insertedRange.font.size = originalFontSize;
                }

                insertedRange.select("End");
                await context.sync();

                const spaceRange = insertedRange.insertText(" ", Word.InsertLocation.after);
                spaceRange.font.name = "Arial";
                spaceRange.font.size = 12;
                spaceRange.select("End");

                await context.sync();
            }).catch(function (error) {
                console.error("Error inserting letter: " + error);
            });
        }
    </script>
</body>
</html>
