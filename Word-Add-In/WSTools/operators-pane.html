<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <title>Operators Pane</title>
    <!-- Office.js SDK -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 12px;
            margin: 0;
            background-color: #f8f9fa;
        }
        h3 {
            font-size: 14px;
            color: #333;
            margin-top: 0;
            margin-bottom: 12px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 6px;
        }
        .symbol-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .symbol-btn {
            background-color: #ffffff;
            border: 1px solid #cccccc;
            border-radius: 4px;
            padding: 10px 4px;
            font-size: 16px;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s ease;
            font-family: 'Cambria Math', 'Segoe UI Symbol', sans-serif;
        }
        .symbol-btn:hover {
            background-color: #e9ecef;
            border-color: #0078d4;
            color: #0078d4;
        }
        .symbol-btn:active {
            background-color: #c8e1ff;
        }
        .symbol-label {
            display: block;
            font-size: 10px;
            color: #666;
            font-family: sans-serif;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <h3>Math Operators</h3>
    <div class="symbol-grid">
        <button class="symbol-btn" onclick="insertOperator('+')">+<span class="symbol-label">plus</span></button>
        <button class="symbol-btn" onclick="insertOperator('−')">−<span class="symbol-label">minus</span></button>
        <button class="symbol-btn" onclick="insertOperator('×')">×<span class="symbol-label">multiply</span></button>
        <button class="symbol-btn" onclick="insertOperator('÷')">÷<span class="symbol-label">divide</span></button>
        <button class="symbol-btn" onclick="insertOperator('≠')">≠<span class="symbol-label">not equal</span></button>
        <button class="symbol-btn" onclick="insertOperator('≥')">≥<span class="symbol-label">gte</span></button>
        <button class="symbol-btn" onclick="insertOperator('≤')">≤<span class="symbol-label">lte</span></button>
        <button class="symbol-btn" onclick="insertOperator('→')">→<span class="symbol-label">right arrow</span></button>
        <button class="symbol-btn" onclick="insertOperator('←')">←<span class="symbol-label">left arrow</span></button>
    </div>

    <script>
        Office.onReady((info) => {
            if (info.host === Office.HostType.Word) {
                console.log("Operators Pane loaded successfully.");
            }
        });

        async function insertOperator(operatorText) {
            await Word.run(async (context) => {
                // 1. Get current selection and load size
                const selection = context.document.getSelection();
                selection.font.load(["size"]);
                await context.sync();

                const originalFontSize = selection.font.size;

                // 2. Insert the operator character in Cambria Math
                const insertedRange = selection.insertText(operatorText, Word.InsertLocation.replace);
                insertedRange.font.name = "Cambria Math";
                if (originalFontSize) {
                    insertedRange.font.size = originalFontSize;
                }

                // 3. Move cursor to end of inserted operator
                insertedRange.select("End");
                await context.sync();

                // 4. Insert trailing space set explicitly to Arial size 12
                const spaceRange = insertedRange.insertText(" ", Word.InsertLocation.after);
                spaceRange.font.name = "Arial";
                spaceRange.font.size = 12;
                spaceRange.select("End");

                await context.sync();
            }).catch(function (error) {
                console.error("Error inserting operator: " + error);
            });
        }
    </script>
</body>
</html>
