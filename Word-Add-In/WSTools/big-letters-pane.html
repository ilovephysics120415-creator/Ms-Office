<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <title>Big Letters Pane</title>
    <!-- Office.js SDK -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 12px;
            margin: 0;
            background-color: #f8f9fa;
        }
        h3 {
            font-size: 14px;
            color: #333;
            margin-top: 0;
            margin-bottom: 12px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 6px;
        }
        .symbol-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .symbol-btn {
            background-color: #ffffff;
            border: 1px solid #cccccc;
            border-radius: 4px;
            padding: 8px 2px;
            font-size: 16px;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s ease;
            font-family: 'Cambria Math', 'Segoe UI Symbol', sans-serif;
        }
        .symbol-btn:hover {
            background-color: #e9ecef;
            border-color: #0078d4;
            color: #0078d4;
        }
        .symbol-btn:active {
            background-color: #c8e1ff;
        }
        .symbol-label {
            display: block;
            font-size: 10px;
            color: #666;
            font-family: sans-serif;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <h3>Math Capital Letters (A-Z)</h3>
    <div class="symbol-grid">
        <button class="symbol-btn" onclick="insertLetter('\u{1D434}')">&#x1D434;<span class="symbol-label">A</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D435}')">&#x1D435;<span class="symbol-label">B</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D436}')">&#x1D436;<span class="symbol-label">C</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D437}')">&#x1D437;<span class="symbol-label">D</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D438}')">&#x1D438;<span class="symbol-label">E</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D439}')">&#x1D439;<span class="symbol-label">F</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D43A}')">&#x1D43A;<span class="symbol-label">G</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D43B}')">&#x1D43B;<span class="symbol-label">H</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D43C}')">&#x1D43C;<span class="symbol-label">I</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D43D}')">&#x1D43D;<span class="symbol-label">J</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D43E}')">&#x1D43E;<span class="symbol-label">K</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D43F}')">&#x1D43F;<span class="symbol-label">L</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D440}')">&#x1D440;<span class="symbol-label">M</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D441}')">&#x1D441;<span class="symbol-label">N</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D442}')">&#x1D442;<span class="symbol-label">O</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D443}')">&#x1D443;<span class="symbol-label">P</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D444}')">&#x1D444;<span class="symbol-label">Q</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D445}')">&#x1D445;<span class="symbol-label">R</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D446}')">&#x1D446;<span class="symbol-label">S</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D447}')">&#x1D447;<span class="symbol-label">T</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D448}')">&#x1D448;<span class="symbol-label">U</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D449}')">&#x1D449;<span class="symbol-label">V</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D44A}')">&#x1D44A;<span class="symbol-label">W</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D44B}')">&#x1D44B;<span class="symbol-label">X</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D44C}')">&#x1D44C;<span class="symbol-label">Y</span></button>
        <button class="symbol-btn" onclick="insertLetter('\u{1D44D}')">&#x1D44D;<span class="symbol-label">Z</span></button>
    </div>

    <script>
        Office.onReady((info) => {
            if (info.host === Office.HostType.Word) {
                console.log("Big Letters Pane loaded successfully.");
            }
        });

        async function insertLetter(letterChar) {
            await Word.run(async (context) => {
                const selection = context.document.getSelection();
                selection.font.load(["size"]);
                await context.sync();

                const originalFontSize = selection.font.size;

                // Insert the mathematical italic capital letter in Cambria Math
                const insertedRange = selection.insertText(letterChar, Word.InsertLocation.replace);
                insertedRange.font.name = "Cambria Math";
                if (originalFontSize) {
                    insertedRange.font.size = originalFontSize;
                }

                insertedRange.select("End");
                await context.sync();

                // Append trailing space explicitly formatted as Arial 12pt
                const spaceRange = insertedRange.insertText(" ", Word.InsertLocation.after);
                spaceRange.font.name = "Arial";
                spaceRange.font.size = 12;
                spaceRange.select("End");

                await context.sync();
            }).catch(function (error) {
                console.error("Error inserting letter: " + error);
            });
        }
    </script>
</body>
</html>
